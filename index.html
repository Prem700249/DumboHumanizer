<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101525">
<meta name="description" content="DumboHumanizer - humanize your writing and check its AI score.">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<title>DumboHumanizer 2.0</title>
<style>
:root{--bg:#0b1020;--panel2:#19243c;--text:#f3f5fc;--muted:#9caac3;--accent:#818cf8;--border:#2b3853;--green:#4ade80;--yellow:#facc15;--red:#f87171}
*{box-sizing:border-box}
body{margin:0;padding:24px 15px 40px;background:radial-gradient(ellipse at top,#1b2850,var(--bg) 65%);color:var(--text);font-family:system-ui,-apple-system,Arial,sans-serif}
.app{max-width:850px;margin:auto}
header{text-align:center;padding:15px 0 25px}
.logo{display:inline-block;width:58px;height:58px;line-height:58px;border-radius:18px;background:linear-gradient(135deg,#818cf8,#c084fc);color:#101525;font-size:28px;font-weight:900}
h1{font-size:34px;margin:12px 0 5px}
h1 span{color:#a5b4fc}
.subtitle{color:var(--muted);margin:0;font-size:14px}
.panel{background:rgba(19,27,48,.96);border:1px solid var(--border);border-radius:18px;padding:17px;margin-bottom:16px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
label{font-size:14px;font-weight:700}
.counter{color:var(--muted);font-size:12px}
textarea{width:100%;min-height:190px;padding:15px;border:1px solid var(--border);border-radius:12px;outline:none;resize:vertical;background:#0c1325;color:var(--text);font-family:inherit;font-size:15px;line-height:1.75}
textarea:focus,select:focus{border-color:var(--accent)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}
.control label{display:block;margin-bottom:7px}
select{width:100%;padding:12px;color:var(--text);background:#0c1325;border:1px solid var(--border);border-radius:10px;font-size:14px}
.checkrow{display:flex;align-items:center;gap:9px;color:#d3daeb;font-size:13px;font-weight:400;margin:15px 0}
.checkrow input{width:17px;height:17px}
button{padding:12px 15px;border:0;border-radius:10px;cursor:pointer;font-family:inherit;font-weight:700;font-size:13px;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.6;cursor:wait}
.primary{width:100%;color:#11152b;background:linear-gradient(100deg,#a5b4fc,#c4b5fd);font-size:16px;margin-top:4px}
.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.actions button{flex:1;min-width:105px}
.progress{display:none;margin-top:14px}
.progress.show{display:block}
.bar{height:8px;background:#0c1325;border:1px solid var(--border);border-radius:999px;overflow:hidden}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#818cf8,#c084fc);transition:width .2s}
.ptext{color:var(--muted);font-size:12px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}
