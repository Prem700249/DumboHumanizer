<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Test</title></head>
<body style="font-family:Arial;padding:20px">
<h2 id="msg">Page loaded. JavaScript not working yet.</h2>
<textarea id="box" rows="5" style="width:100%"></textarea>
<p id="count">0 words</p>
<button id="btn">Test button</button>
<p id="result"></p>
<script>
document.getElementById("msg").textContent = "JavaScript is working.";
document.getElementById("box").oninput = function () {
  var n = this.value.trim() ? this.value.trim().split(/\s+/).length : 0;
  document.getElementById("count").textContent = n + " words";
};
document.getElementById("btn").onclick = function () {
  document.getElementById("result").textContent = "Button clicked.";
};
</script>
</body>
</html>
